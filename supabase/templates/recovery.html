<h2>Redefinir senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no Orkestra.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nova-senha"
    >Criar nova senha</a
  >
</p>
<p>Se você não pediu, ignore este e-mail. Sua senha continua a mesma.</p>
