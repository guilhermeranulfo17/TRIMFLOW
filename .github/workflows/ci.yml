name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# shell: bash explícito = `bash -eo pipefail`: falha no dry-run não some no `| tee`.
defaults:
  run:
    shell: bash

jobs:
  # Mostra no resumo do job quais migrations serão aplicadas em produção no merge.
  # Sem os segredos (PR de fork, Dependabot), o job é pulado sem falhar o CI.
  migrations-dry-run:
    name: Migrations que serão aplicadas no merge (dry-run em produção)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nsqoenggvshzkhbpurfi
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            echo "### Dry-run das migrations pulado: segredos indisponíveis neste PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.segredos.outputs.tem == 'sim'
        uses: actions/checkout@v5
      - if: steps.segredos.outputs.tem == 'sim'
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Ligar ao projeto de produção (só leitura do histórico)
        if: steps.segredos.outputs.tem == 'sim'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry-run
        if: steps.segredos.outputs.tem == 'sim'
        run: |
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee dry-run.txt
          {
            echo "### Migrations que serão aplicadas em produção no merge"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  qualidade:
    name: Lint, typecheck, unitários e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unitários com cobertura (mínimo de 95% no motor de preço)
        run: pnpm test:coverage

  integracao-e2e:
    name: Integração (RLS) e E2E com Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # O Storage fica ligado: a migration do bucket "midia" e o upload de imagens precisam dele.
      - name: Subir Supabase local (migrations + seed)
        run: >-
          pnpm exec supabase start
          -x realtime,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Exportar variáveis do Supabase local
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "E2E_STORAGE=1"
            echo "IP_HASH_SALT=sal-do-ci-orkestra"
            echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
            echo "CRON_SECRET=segredo-cron-do-ci"
            # Etapa 9A: cobrança contra a API falsa do Asaas (Playwright sobe em :4010) e a
            # equipe do /interno criada pelo seed
            echo "ASAAS_API_KEY=chave-falsa"
            echo "ASAAS_AMBIENTE=sandbox"
            echo "ASAAS_WEBHOOK_TOKEN=token-falso"
            echo "ASAAS_API_URL=http://localhost:4010/v3"
            echo "ORKESTRA_ADMINS=equipe@orkestra.local"
          } >> "$GITHUB_ENV"
          # Chaves VAPID descartáveis, geradas a cada execução (push nos E2E).
          node scripts/vapid.mjs >> "$GITHUB_ENV"

      - name: Recriar o banco do zero (pnpm db:reset)
        run: pnpm db:reset

      - name: Testes de integração (RLS, cadastro, slug)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Logs do Supabase
        if: failure()
        run: docker ps -a && docker logs supabase_auth_orkestra --tail 200 || true
