name: Backup manual do banco

# Etapa 9B · B.7. Cópia do banco de produção (schema, dados e papéis) quando você quiser:
# Actions → "Backup manual do banco" → Run workflow. O arquivo sai CRIPTOGRAFADO (AES-256, gpg)
# com a senha do segredo BACKUP_SENHA e fica 7 dias como artefato da execução. Nunca sai um dump
# sem criptografia: sem a senha o workflow para antes de copiar qualquer coisa, e o texto puro é
# apagado antes do upload (só o .gpg sobe). Como restaurar: docs/BACKUP.md.

on:
  workflow_dispatch:

concurrency:
  group: backup-producao
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SUPABASE_PROJECT_REF: nsqoenggvshzkhbpurfi

jobs:
  backup:
    name: Copiar, criptografar e guardar por 7 dias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Conferir segredos (sem senha de backup, nada é copiado)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD."
            exit 1
          fi
          if [ "${#BACKUP_SENHA}" -lt 20 ]; then
            echo "::error::Cadastre o segredo BACKUP_SENHA com pelo menos 20 caracteres."
            exit 1
          fi

      - name: Ligar ao projeto de produção
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Copiar schema, dados e papéis (só em disco temporário)
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/backup"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" -f schema.sql
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --role-only -f papeis.sql
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f dados.sql
          ls -la

      - name: Criptografar (AES-256) e apagar o texto puro
        run: |
          umask 077
          cd "$RUNNER_TEMP/backup"
          NOME="orkestra-$(date -u +%Y%m%d-%H%M%S)"
          tar -czf "$NOME.tar.gz" schema.sql papeis.sql dados.sql
          shred -u schema.sql papeis.sql dados.sql
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 -o "$RUNNER_TEMP/$NOME.tar.gz.gpg" "$NOME.tar.gz" <<< "$BACKUP_SENHA"
          shred -u "$NOME.tar.gz"
          rm -rf "$RUNNER_TEMP/backup"
          # trava: só pode existir o arquivo criptografado
          file -b "$RUNNER_TEMP/$NOME.tar.gz.gpg" | grep -qi 'encrypted' || { echo "::error::arquivo não criptografado"; exit 1; }
          echo "ARQUIVO=$RUNNER_TEMP/$NOME.tar.gz.gpg" >> "$GITHUB_ENV"
          {
            echo "### Backup criptografado pronto"
            echo "Arquivo: \`$NOME.tar.gz.gpg\` ($(du -h "$RUNNER_TEMP/$NOME.tar.gz.gpg" | cut -f1)), guardado por 7 dias."
            echo "Para abrir: \`gpg -d $NOME.tar.gz.gpg | tar -xz\` (pede a BACKUP_SENHA). Passo a passo: docs/BACKUP.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o arquivo criptografado (7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-criptografado
          path: ${{ env.ARQUIVO }}
          retention-days: 7
          if-no-files-found: error
