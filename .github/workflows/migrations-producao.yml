name: Migrations em produção

# Aplica no banco de produção (Supabase, projeto "orkestra") as migrations novas de
# supabase/migrations a cada merge na main. Nada de aplicar à mão.
#
# Regras:
# - Nunca `--include-all`, `--include-seed`, reset ou `migration repair`.
# - Toda migration precisa ser compatível com o código anterior (expandir → contrair): a Vercel
#   publica o app ao mesmo tempo que este workflow roda.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

# Nunca duas aplicações ao mesmo tempo; uma execução em andamento não é cancelada.
concurrency:
  group: migrations-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: nsqoenggvshzkhbpurfi

jobs:
  aplicar:
    name: Aplicar migrations novas em produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD no repositório."
            exit 1
          fi

      - name: Ligar ao projeto de produção
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: O que vai ser aplicado (dry-run)
        run: |
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee dry-run.txt
          {
            echo "### Migrations a aplicar em produção"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
